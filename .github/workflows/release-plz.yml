name: release-plz

# Automated, dependency-ordered releases for the Deputy workspace.
# On every push to `main`, release-plz opens/updates a release PR (version bumps from
# Conventional Commits + CHANGELOG). Merging that PR tags the release and publishes every
# changed crate to crates.io in dependency order.
#
# Requires the `CARGO_REGISTRY_TOKEN` repository secret (a scoped crates.io token). See
# RELEASING.md for the one-time setup.

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-plz:
    name: release-plz
    runs-on: ubuntu-latest
    # Never run two releases at once; do not cancel an in-flight publish.
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # release-plz needs full history to compute changes

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run release-plz
        uses: release-plz/action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
