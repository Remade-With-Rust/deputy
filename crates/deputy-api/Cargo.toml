[package]
name = "deputy-api"
description = "The API-first capability surface: in-process API plus a localhost transport."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords = ["supply-chain", "security", "dependencies", "api"]
categories = ["development-tools", "web-programming::http-server"]

[dependencies]
deputy-core = { path = "../deputy-core", version = "0.4.2" }
deputy-store = { path = "../deputy-store", version = "0.4.2" }
deputy-id = { path = "../deputy-id", version = "0.4.2" }
deputy-ecosystem = { path = "../deputy-ecosystem", version = "0.4.2" }
deputy-acquire = { path = "../deputy-acquire", version = "0.4.2" }
deputy-analyze = { path = "../deputy-analyze", version = "0.4.2" }
deputy-scan = { path = "../deputy-scan", version = "0.4.2" }
deputy-deploy = { path = "../deputy-deploy", version = "0.4.2" }
# SpaceDB SDK (library: allocator opted out) re-exports Layer 5 capabilities.
# mata-cap is the typed API-first authorize chokepoint every Deputy op also hits.
spacedb-sdk = { workspace = true }
spacedb-access = { workspace = true }
mata-cap = { workspace = true }
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "macros", "sync"] }
tower-http = { version = "0.6", features = ["cors"] }
# GitHub REST client (list/acquire the user's repos via OAuth or a PAT). rustls, no OpenSSL.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# RUSTSEC advisory-db importer: download + decompress the tarball, parse the TOML frontmatter.
flate2 = "1"
tar = "0.4"
toml = "0.8"
semver = "1"
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
