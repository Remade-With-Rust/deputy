[package]
name = "deputy-api"
description = "The API-first capability surface: in-process API plus a localhost transport."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords = ["supply-chain", "security", "dependencies", "api"]
categories = ["development-tools", "web-programming::http-server"]

[dependencies]
deputy-core = { path = "../deputy-core", version = "0.1.0" }
deputy-store = { path = "../deputy-store", version = "0.1.0" }
deputy-id = { path = "../deputy-id", version = "0.1.0" }
deputy-ecosystem = { path = "../deputy-ecosystem", version = "0.1.0" }
deputy-acquire = { path = "../deputy-acquire", version = "0.1.0" }
deputy-analyze = { path = "../deputy-analyze", version = "0.1.0" }
deputy-scan = { path = "../deputy-scan", version = "0.1.0" }
deputy-deploy = { path = "../deputy-deploy", version = "0.1.0" }
# SpaceDB Layer 5 — signed, scoped, expiring, revocable capabilities (P-256, mID family) that
# gate every operation for humans AND AI agents.
spacedb-access = "=0.1.0"
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "macros"] }
tower-http = { version = "0.6", features = ["cors"] }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
