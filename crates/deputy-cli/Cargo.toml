[package]
name = "deputy-cli"
description = "Headless CLI over deputy-api."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords = ["supply-chain", "security", "dependencies", "cargo", "vault"]
categories = ["command-line-utilities", "development-tools::cargo-plugins"]

[[bin]]
name = "deputy"
path = "src/main.rs"

[dependencies]
deputy-alloc = { path = "../deputy-alloc", version = "0.4.2" }
deputy-core = { path = "../deputy-core", version = "0.4.2" }
deputy-store = { path = "../deputy-store", version = "0.4.2" }
deputy-ecosystem = { path = "../deputy-ecosystem", version = "0.4.2" }
deputy-acquire = { path = "../deputy-acquire", version = "0.4.2" }
deputy-analyze = { path = "../deputy-analyze", version = "0.4.2" }
deputy-scan = { path = "../deputy-scan", version = "0.4.2" }
deputy-deploy = { path = "../deputy-deploy", version = "0.4.2" }
deputy-api = { path = "../deputy-api", version = "0.4.2" }
clap = { version = "4", features = ["derive"] }
