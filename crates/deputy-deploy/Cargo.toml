[package]
name = "deputy-deploy"
description = "Promotion (dirty to prod), redeploy into source, and the fail-closed deploy gate."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
deputy-core = { path = "../deputy-core", version = "0.1.0" }
deputy-store = { path = "../deputy-store", version = "0.1.0" }
serde_json = { workspace = true }
# Extract prod .crate tarballs into a Cargo vendor tree (pure Rust, no C).
flate2 = "1"
tar = "0.4"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
