[package]
name = "deputy-id"
description = "MATA mID verification (pure Rust) and Deputy's identity & session model."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords = ["identity", "authentication", "did", "jwt", "mid"]
categories = ["authentication", "cryptography"]
[dependencies]
# The public MATA mID relying-party kit (github.com/Remade-With-Rust/mid) — verification
# (via its mid-verify core) PLUS the stateful RP duties this crate used to hand-roll:
# single-use nonces, genesis anchoring, rollback detection. Exact pin (`=`): Deputy
# practises its own thesis and freezes the trust-base version (AUTH.md §10).
mid-signin = "=0.1.0"

[dev-dependencies]
# Token-minting harness for tests: mint real wallet-style mID tokens, then verify them. Same
# pinned versions as the kit's core so the canonical wire format matches exactly.
mid-verify = "=0.1.0"
mid-issuer = "=0.1.0"
kms-client = "=0.1.0"
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "std"] }
sha2 = "0.10"
base64 = "0.22"
serde_json = { workspace = true }
