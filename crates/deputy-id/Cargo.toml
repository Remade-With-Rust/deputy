[package]
name = "deputy-id"
description = "MATA mID verification (pure Rust) and Deputy's identity & session model."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords = ["identity", "authentication", "did", "jwt", "mid"]
categories = ["authentication", "cryptography"]
[dependencies]
# The public MATA mID reference (RP-side verification) — published from
# github.com/Remade-With-Rust/mid, the authoritative source the JS SDK
# (@matanetwork/sovereign-id) mirrors. Exact pin (`=`): Deputy practises its own thesis and
# freezes the trust-base version. Chain: mid-verify -> mid-issuer -> kms-client (pulls
# reqwest/tokio; see AUTH.md §10).
mid-verify = "=0.1.0"
thiserror = { workspace = true }
getrandom = "0.3"

[dev-dependencies]
# Token-minting harness for tests: mint real wallet-style mID tokens, then verify them. Same
# pinned version as the verifier so the canonical wire format matches exactly.
mid-issuer = "=0.1.0"
kms-client = "=0.1.0"
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "std"] }
sha2 = "0.10"
base64 = "0.22"
serde_json = { workspace = true }
