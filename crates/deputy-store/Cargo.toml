[package]
name = "deputy-store"
description = "Content-addressed dirty/prod stores and the encrypted metadata database."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords = ["vault", "encryption", "storage", "content-addressed", "security"]
categories = ["cryptography", "database-implementations"]

[dependencies]
deputy-core = { path = "../deputy-core", version = "0.4.2" }
deputy-crypto = { path = "../deputy-crypto", version = "0.4.2" }
# SpaceDB 0.5 (Remade With Rust). The SDK is the developer surface; libraries opt out of
# its default rusty_alloc so deliverables own the allocator. See docs/STORAGE.md §4 / §7.
spacedb-sdk = { workspace = true }
spacedb-store = { workspace = true }
spacedb-crdt = { workspace = true }
spacedb-durability = { workspace = true }
spacedb-replica = { workspace = true }
spacedb-meter = { workspace = true }
# Internal wire format (never a public API — those stay JSON).
oxicode = { workspace = true }
# Compress snapshot/sync payloads before erasure-coding / encryption.
rusty_zstd = { workspace = true }
sha2 = "0.10"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
tempfile = "3"
