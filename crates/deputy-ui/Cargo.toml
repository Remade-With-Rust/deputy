[package]
name = "deputy-ui"
description = "Dioxus app (web + desktop) — a thin client of the Deputy API."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
# A Dioxus application binary, not a reusable library — not published to crates.io.
publish = false

[features]
# Pick a platform at build time. `dx serve --platform web` enables `web`;
# `dx serve --platform desktop` (or `cargo run --features desktop`) enables `desktop`.
web = ["dioxus/web"]
desktop = [
    "dioxus/desktop",
    "dep:reqwest",
    "dep:tokio",
    "dep:deputy-api",
    "dep:base64",
    "dep:rfd",
    "dep:windows-sys",
]

[dependencies]
deputy-alloc = { path = "../deputy-alloc", version = "0.4.2" }
dioxus = { version = "0.7" }
serde = { workspace = true }
serde_json = { workspace = true }
# House UI chrome — glyphs, design tokens, a11y. Allocator lives in deputy-alloc.
rusty_symbols = { workspace = true }
rusty_tokens = { workspace = true }
rusty_a11y = { workspace = true }

# Desktop (native) only — pulled in by the `desktop` feature. The browser's fetch and timers
# don't exist on native, so reqwest is the HTTP client and tokio provides async sleep.
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
    "blocking",
], optional = true }
tokio = { version = "1", features = ["time"], optional = true }
# The embedded API + vault — the desktop app is self-contained (no separate `deputy serve`).
deputy-api = { path = "../deputy-api", version = "0.4.2", optional = true }
base64 = { version = "0.22", optional = true }
# Native folder picker for local-folder ingestion (desktop only).
rfd = { version = "0.15", optional = true }
# Windows caption/taskbar chrome (DWM title-bar color). Unused on other OS.
windows-sys = { version = "0.59", optional = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
] }

# Browser (wasm32) only — the web renderer's fetch + timer shims. Gated to wasm32 so the crate
# still compiles trivially on the host (where, without a platform feature, it is just a stub
# `main`). Build/run the web app with: dx serve --platform web.
[target.'cfg(target_arch = "wasm32")'.dependencies]
gloo-net = { version = "0.6", features = ["json"] }
gloo-timers = { version = "0.3", features = ["futures"] }
