# cargo-deny — supply-chain gate for Deputy's OWN dependencies (dogfooding the mission).
# Enforces README's "No GPL/LGPL anywhere in the dependency tree".
# Run: cargo deny check

[licenses]
# Anything not in `allow` is denied. GPL/LGPL/AGPL are deliberately absent → denied.
confidence-threshold = 0.9
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",
    # Mozilla CA root bundle (webpki-roots), pulled via the vendored mid-verify -> kms-client
    # -> reqwest/rustls chain. A permissive data license, not copyleft.
    "CDLA-Permissive-2.0",
]

# The vendored MATA mID crates ship no `license` field in their Cargo.toml. Their published
# npm mirrors (@matanetwork/sovereign-id*) are MIT; assert that here until the Rust crates
# carry a license field upstream. See docs/AUTH.md §10.
[[licenses.clarify]]
crate = "mid-verify"
expression = "MIT"
license-files = []

[[licenses.clarify]]
crate = "mid-issuer"
expression = "MIT"
license-files = []

[[licenses.clarify]]
crate = "kms-client"
expression = "MIT"
license-files = []

[[licenses.clarify]]
crate = "kms-types"
expression = "MIT"
license-files = []

[bans]
multiple-versions = "warn"
# Downgraded to "warn": the vendored MATA mID chain (external, public path-dep crates in
# mata-master) uses versionless path deps among themselves, which read as wildcards and
# cannot be exempted by allow-wildcard-paths (that only covers private crates). Our own
# intra-workspace path deps carry explicit versions. Revisit if mid-verify is published.
wildcards = "warn"
allow-wildcard-paths = true

[advisories]
# Advisory DB is fetched from the network (CI does this); fail on known issues.
yanked = "deny"
ignore = [
    # `atomic-polyfill` is UNMAINTAINED (not a vulnerability). It is a transitive, target-gated
    # dependency of SpaceDB via `postcard` -> `heapless 0.7`. Accepted until SpaceDB's postcard
    # moves to a heapless that uses `portable-atomic`. Reviewed 2026-06-24.
    "RUSTSEC-2023-0089",
    # `instant` is UNMAINTAINED (not a vulnerability; recommends `web-time`). Transitive via
    # SpaceDB durability: reed-solomon-erasure -> parking_lot 0.11 -> instant. Accepted until
    # reed-solomon bumps parking_lot. Reviewed 2026-06-24.
    "RUSTSEC-2024-0384",
    # `smallstr` is UNMAINTAINED (not a vulnerability; recommends `compact_str`/`smol_str`), and
    # every version is affected — there is no safe upgrade. Transitive via SpaceDB Layer 1:
    # spacedb-crdt -> yrs 0.25 -> smallstr. Accepted until `yrs` drops it. Reviewed 2026-08-10.
    "RUSTSEC-2026-0215",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

# First-party MATA crates live in this GitHub org: the mID reference (mid-verify/mid-issuer/
# kms-client) today, and SpaceDB once it splits out of mata-master. Trusting the org is the
# right boundary — these are our own source-of-truth repos, each pinned to a rev in Cargo.toml.
[sources.allow-org]
github = ["Remade-With-Rust"]
